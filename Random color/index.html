<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Color Generator</title>
    <link rel="stylesheet" href="Random color/site.css">
    <style>
    body {
      display: grid;
      place-items: center;
      padding: 30px 18px;
      background: #f4f1e9;
    }
    main {
      width: min(100%, 520px);
      padding: clamp(28px, 7vw, 52px);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(23, 33, 43, .1);
      text-align: center;
      animation: page-enter .7s both;
    }
    h1 {
      margin: 0 0 24px;
      font: 700 clamp(2rem, 7vw, 3rem)/1.05 var(--font-display);
      letter-spacing: -.06em;
    }
    #ChangeMe {
      width: min(100%, 320px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 22px;
      background-color: #e1e1e1;
      box-shadow: 0 14px 32px rgba(23, 33, 43, .14);
      transition: background-color .35s ease, transform .35s ease;
    }
    #ChangeMe.is-changing {
      animation: color-pop .4s ease;
    }
    @keyframes color-pop {
      50% { transform: scale(.96) rotate(-1deg); }
    }
    button {
      margin-top: 24px;
      padding-inline: 26px;
    }
    #NewColor {
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    </style>
  </head>

  <body>
    <main>
      <h1>Generate a random color.</h1>
      <div id="ChangeMe" aria-label="Color preview"></div>
      <button onclick="Generate()">Generate</button>
      <p id="NewColor" aria-live="polite">Your next color is one click away.</p>
    </main>
  </body>

  <script>
    let MinValue = 0;
    let MaxValue = 255;
    let ColorBoard= document.getElementById("ChangeMe")
    let Output = document.getElementById("NewColor");
  

    function Generate() {
      //Generate Random Numbers for rgb color
      const RandomRed =
        Math.floor(Math.random() * (MaxValue - MinValue + 1)) + MinValue;
      const RandomGreen =
        Math.floor(Math.random() * (MaxValue - MinValue + 1)) + MinValue;
      const RandomBlue =
        Math.floor(Math.random() * (MaxValue - MinValue + 1)) + MinValue;
      const randomColor = `rgb(${RandomRed}, ${RandomGreen}, ${RandomBlue})`;
      
      //Assign New Color to Div background color
      ColorBoard.style.backgroundColor = randomColor;
      ColorBoard.classList.remove("is-changing");
      void ColorBoard.offsetWidth;
      ColorBoard.classList.add("is-changing");
      Output.textContent = `The new color is ${randomColor}`;
      console.log(`The New Color is: ${randomColor}.`);
    }
  </script>
</html>
